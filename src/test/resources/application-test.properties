spring.datasource.url=jdbc:h2:mem:primenest-test;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.h2.console.enabled=false
app.demo.seed-data=false
# The production auth rate limit (10 requests/15min) is tuned against abuse, not against a
# growing integration test suite that legitimately registers many users per run.
app.auth.rate-limit.max-requests=1000
app.storage.lease-documents=${java.io.tmpdir}/primenest-test-lease-documents
