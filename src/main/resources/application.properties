spring.application.name=EstateX
server.port=${SERVER_PORT:8081}

spring.datasource.url=${DB_URL:jdbc:${DB_KIND:mariadb}://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:primenest_prop}${DB_URL_PARAMS:?createDatabaseIfNotExist=true&useUnicode=true&characterEncoding=utf8}}
spring.datasource.driver-class-name=${DB_DRIVER:org.mariadb.jdbc.Driver}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:root}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=false
# Load lazy relations for a whole page in one IN (...) query instead of one query per row (N+1).
spring.jpa.properties.hibernate.default_batch_fetch_size=64
# Group inserts/updates into JDBC batches.
spring.jpa.properties.hibernate.jdbc.batch_size=50
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true
# Reuse parsed query plans.
spring.jpa.properties.hibernate.query.plan_cache_max_size=4096
# Connection pool: sized for a small instance; raise DB_POOL_MAX with the plan.
spring.datasource.hikari.maximum-pool-size=${DB_POOL_MAX:10}
spring.datasource.hikari.minimum-idle=${DB_POOL_MIN_IDLE:2}
spring.datasource.hikari.connection-timeout=10000
spring.datasource.hikari.max-lifetime=1500000
# Java 21+ virtual threads: blocking I/O (DB, mail, payments) no longer pins a platform thread per request.
spring.threads.virtual.enabled=true

# Behind Render's proxy, take the visitor's IP from X-Forwarded-For (trusted only from private
# proxy addresses). Without this every request looks like it comes from the proxy, and the
# per-IP login/enquiry rate limits would throttle all users together.
server.forward-headers-strategy=native
server.compression.enabled=true
server.compression.mime-types=application/json,text/html,text/css,application/javascript
server.compression.min-response-size=1024

spring.jackson.default-property-inclusion=non_null
spring.jackson.deserialization.fail-on-null-for-primitives=false
spring.jackson.deserialization.fail-on-unknown-properties=false
spring.servlet.multipart.max-file-size=15MB
spring.servlet.multipart.max-request-size=60MB

spring.mail.host=${SMTP_HOST:localhost}
spring.mail.port=${SMTP_PORT:1025}
spring.mail.username=${SMTP_USERNAME:}
spring.mail.password=${SMTP_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${SMTP_AUTH:false}
spring.mail.properties.mail.smtp.starttls.enable=${SMTP_STARTTLS:false}

app.cors.allowed-origins=${CORS_ORIGINS:https://primenest-frontend.onrender.com,http://localhost:3000,http://localhost:3001,http://127.0.0.1:3000,http://127.0.0.1:3001}
app.demo.seed-data=false
app.storage.lease-documents=${LEASE_DOCUMENT_STORAGE:storage/lease-documents}
app.storage.property-photos=${PROPERTY_PHOTO_STORAGE:storage/property-photos}
app.storage.kyc-documents=${KYC_DOCUMENT_STORAGE:storage/kyc-documents}
app.storage.maintenance-photos=${MAINTENANCE_PHOTO_STORAGE:storage/maintenance-photos}
app.storage.s3.endpoint=${S3_ENDPOINT:}
app.storage.s3.access-key=${S3_ACCESS_KEY_ID:}
app.storage.s3.secret-key=${S3_SECRET_ACCESS_KEY:}
app.storage.s3.bucket=${S3_BUCKET_NAME:}
app.storage.s3.region=${S3_REGION:auto}
app.public-base-url=${API_PUBLIC_BASE_URL:https://primenest-backend-xwgh.onrender.com}
app.frontend-base-url=${WEB_BASE_URL:https://primenest-frontend.onrender.com}
app.mail.from=${MAIL_FROM:no-reply@estatex.local}
app.auth.session-ttl-hours=${SESSION_TTL_HOURS:168}
app.auth.rate-limit.max-requests=${AUTH_RATE_LIMIT_MAX:10}
app.auth.rate-limit.window-minutes=${AUTH_RATE_LIMIT_WINDOW_MINUTES:15}
# Two-step sign-in: authenticator secrets are encrypted with this key. Set a long random value
# in production and never change it (existing authenticator setups would stop working).
app.auth.two-factor.encryption-key=${APP_2FA_ENCRYPTION_KEY:}
# SMS for sign-in codes and password resets. Africa's Talking is used if its keys are set,
# otherwise Twilio; with neither, messages are only logged and SMS codes aren't offered unless
# SMS_ALLOW_LOG_GATEWAY=true (local development only - never in production).
app.sms.africastalking.username=${AFRICASTALKING_USERNAME:}
app.sms.africastalking.api-key=${AFRICASTALKING_API_KEY:}
app.sms.africastalking.sender-id=${AFRICASTALKING_SENDER_ID:}
app.sms.twilio.account-sid=${TWILIO_ACCOUNT_SID:}
app.sms.twilio.auth-token=${TWILIO_AUTH_TOKEN:}
app.sms.twilio.from=${TWILIO_FROM:}
app.sms.allow-log-gateway=${SMS_ALLOW_LOG_GATEWAY:false}

# ArcGIS Location Platform key: optional, enables keyed geocoding (required by Esri for stored results).
app.maps.arcgis-api-key=${ARCGIS_API_KEY:}
app.maps.geocoding-enabled=${GEOCODING_ENABLED:true}

app.ai.anthropic-api-key=${ANTHROPIC_API_KEY:}
app.ai.anthropic-model=${ANTHROPIC_MODEL:claude-sonnet-5}
app.ai.gemini-api-key=${GEMINI_API_KEY:}
app.ai.gemini-model=${GEMINI_MODEL:gemini-3.5-flash-lite}

app.payments.paynow.integration-id=${PAYNOW_INTEGRATION_ID:}
app.payments.paynow.integration-key=${PAYNOW_INTEGRATION_KEY:}
# Paynow test mode only accepts the merchant account's own email as "authemail": set this while
# testing. Leave it unset in live mode and the payer's email is sent instead.
app.payments.paynow.auth-email=${PAYNOW_AUTH_EMAIL:}
app.payments.stripe.secret-key=${STRIPE_SECRET_KEY:}
app.payments.stripe.webhook-secret=${STRIPE_WEBHOOK_SECRET:}
# EstateX's REIT transaction fee, % added to purchases and taken from sale proceeds.
app.investments.transaction-fee-percent=${REIT_FEE_PERCENT:1.5}
# Automatic ID checks (both optional; off until keys are set).
# Dojah: ID number looked up in the national register (Zimbabwe built in; add more countries with
# DOJAH_EXTRA_ENDPOINTS, e.g. KE:NATIONAL_ID=/api/v1/ke/kyc/id?id=).
app.idcheck.dojah.app-id=${DOJAH_APP_ID:}
app.idcheck.dojah.secret-key=${DOJAH_SECRET_KEY:}
app.idcheck.dojah.base-url=${DOJAH_BASE_URL:https://api.dojah.io}
app.idcheck.dojah.extra-endpoints=${DOJAH_EXTRA_ENDPOINTS:}
# Didit: international photo ID + selfie check (220+ countries).
app.idcheck.didit.api-key=${DIDIT_API_KEY:}
app.idcheck.didit.workflow-id=${DIDIT_WORKFLOW_ID:}
app.idcheck.didit.webhook-secret=${DIDIT_WEBHOOK_SECRET:}


# Flyway: runs AFTER Hibernate's ddl-auto=update (see common/FlywayAfterHibernateConfig).
# Hibernate still owns table shapes; Flyway owns versioned constraints, indexes and data fixes.
# Existing databases have no flyway_schema_history yet, so baseline at 0 and apply V1+.
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0
spring.flyway.locations=classpath:db/migration/common,classpath:db/migration/{vendor}
spring.flyway.fail-on-missing-locations=false

# All business dates (rent due, mandate expiry, campaign day N) are computed in this zone.
app.timezone=Africa/Harare
app.storage.mandate-documents=${MANDATE_DOCUMENT_STORAGE:storage/mandate-documents}
app.storage.agency-documents=${AGENCY_DOCUMENT_STORAGE:storage/agency-documents}

# Comma-separated emails granted platform ADMIN on register/login/startup (CI, staging, fresh DBs).
# Empty by default: does nothing unless set in the environment.
app.bootstrap.admin-emails=${APP_BOOTSTRAP_ADMIN_EMAILS:}
