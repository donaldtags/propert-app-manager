spring.application.name=PrimeNest-prop
server.port=${SERVER_PORT:8081}

spring.datasource.url=${DB_URL:jdbc:${DB_KIND:mariadb}://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:primenest_prop}${DB_URL_PARAMS:?createDatabaseIfNotExist=true&useUnicode=true&characterEncoding=utf8}}
spring.datasource.driver-class-name=${DB_DRIVER:org.mariadb.jdbc.Driver}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:root}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true

spring.jackson.default-property-inclusion=non_null
spring.jackson.deserialization.fail-on-null-for-primitives=false
spring.jackson.deserialization.fail-on-unknown-properties=false
spring.servlet.multipart.max-file-size=8MB
spring.servlet.multipart.max-request-size=32MB

spring.mail.host=${SMTP_HOST:localhost}
spring.mail.port=${SMTP_PORT:1025}
spring.mail.username=${SMTP_USERNAME:}
spring.mail.password=${SMTP_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${SMTP_AUTH:false}
spring.mail.properties.mail.smtp.starttls.enable=${SMTP_STARTTLS:false}

app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:3001,http://127.0.0.1:3000,http://127.0.0.1:3001}
app.demo.seed-data=false
app.storage.lease-documents=${LEASE_DOCUMENT_STORAGE:storage/lease-documents}
app.storage.property-photos=${PROPERTY_PHOTO_STORAGE:storage/property-photos}
app.storage.kyc-documents=${KYC_DOCUMENT_STORAGE:storage/kyc-documents}
app.storage.maintenance-photos=${MAINTENANCE_PHOTO_STORAGE:storage/maintenance-photos}
app.public-base-url=${PUBLIC_BASE_URL:http://localhost:8081}
app.frontend-base-url=${FRONTEND_BASE_URL:http://localhost:3000}
app.mail.from=${MAIL_FROM:no-reply@primenest.local}
app.auth.session-ttl-hours=${SESSION_TTL_HOURS:168}
app.auth.rate-limit.max-requests=${AUTH_RATE_LIMIT_MAX:10}
app.auth.rate-limit.window-minutes=${AUTH_RATE_LIMIT_WINDOW_MINUTES:15}

app.ai.anthropic-api-key=${ANTHROPIC_API_KEY:}
app.ai.anthropic-model=${ANTHROPIC_MODEL:claude-opus-4-8}
