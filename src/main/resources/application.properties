spring.application.name=PrimeNest-prop
server.port=${SERVER_PORT:8081}

spring.datasource.url=${DB_URL:jdbc:${DB_KIND:mariadb}://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:primenest_prop}${DB_URL_PARAMS:?createDatabaseIfNotExist=true&useUnicode=true&characterEncoding=utf8}}
spring.datasource.driver-class-name=${DB_DRIVER:org.mariadb.jdbc.Driver}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:root}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true

server.compression.enabled=true
server.compression.mime-types=application/json,text/html,text/css,application/javascript
server.compression.min-response-size=1024

spring.jackson.default-property-inclusion=non_null
spring.jackson.deserialization.fail-on-null-for-primitives=false
spring.jackson.deserialization.fail-on-unknown-properties=false
spring.servlet.multipart.max-file-size=15MB
spring.servlet.multipart.max-request-size=60MB

spring.mail.host=${SMTP_HOST:localhost}
spring.mail.port=${SMTP_PORT:1025}
spring.mail.username=${SMTP_USERNAME:}
spring.mail.password=${SMTP_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${SMTP_AUTH:false}
spring.mail.properties.mail.smtp.starttls.enable=${SMTP_STARTTLS:false}

app.cors.allowed-origins=${CORS_ORIGINS:https://primenest-frontend.onrender.com,http://localhost:3000,http://localhost:3001,http://127.0.0.1:3000,http://127.0.0.1:3001}
app.demo.seed-data=false
app.storage.lease-documents=${LEASE_DOCUMENT_STORAGE:storage/lease-documents}
app.storage.property-photos=${PROPERTY_PHOTO_STORAGE:storage/property-photos}
app.storage.kyc-documents=${KYC_DOCUMENT_STORAGE:storage/kyc-documents}
app.storage.maintenance-photos=${MAINTENANCE_PHOTO_STORAGE:storage/maintenance-photos}
app.storage.s3.endpoint=${S3_ENDPOINT:}
app.storage.s3.access-key=${S3_ACCESS_KEY_ID:}
app.storage.s3.secret-key=${S3_SECRET_ACCESS_KEY:}
app.storage.s3.bucket=${S3_BUCKET_NAME:}
app.storage.s3.region=${S3_REGION:auto}
app.public-base-url=${API_PUBLIC_BASE_URL:https://primenest-backend-xwgh.onrender.com}
app.frontend-base-url=${WEB_BASE_URL:https://primenest-frontend.onrender.com}
app.mail.from=${MAIL_FROM:no-reply@primenest.local}
app.auth.session-ttl-hours=${SESSION_TTL_HOURS:168}
app.auth.rate-limit.max-requests=${AUTH_RATE_LIMIT_MAX:10}
app.auth.rate-limit.window-minutes=${AUTH_RATE_LIMIT_WINDOW_MINUTES:15}

app.ai.anthropic-api-key=${ANTHROPIC_API_KEY:}
app.ai.anthropic-model=${ANTHROPIC_MODEL:claude-opus-4-8}

# Live ZSE quotes via the MyStocks Africa partner API. Without a key, ZimbabweReitMarketService
# falls back to scraping a public ZSE price sheet instead.
app.market.mystocks.api-key=${MYSTOCKS_API_KEY:}
app.market.mystocks.base-url=${MYSTOCKS_BASE_URL:https://mystocks.africa/api/sandbox/v1/partner}
