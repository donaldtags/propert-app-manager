<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Offline – EstateX</title>
  <style>
    :root { color-scheme: light dark; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; font-family: Inter, system-ui, sans-serif;
           background: #F5F2EA; color: #0B1D32; padding: 16px; }
    @media (prefers-color-scheme: dark) { body { background: #0B1D32; color: #F5F2EA; } p { color: #A3ABB5 !important; } }
    main { max-width: 420px; text-align: center; }
    h1 { font-family: Montserrat, Inter, sans-serif; font-size: 1.4rem; }
    p { color: #5E6873; line-height: 1.5; }
    a { display: inline-block; margin-top: 16px; padding: 12px 20px; border-radius: 10px; background: #0B1D32; color: #F5F2EA; text-decoration: none; font-weight: 600; }
    @media (prefers-color-scheme: dark) { a { background: #C9CED4; color: #0B1D32; } }
  </style>
</head>
<body>
  <main>
    <h1>You're offline</h1>
    <p>This page hasn't been saved on this device yet. Pages you've opened before, new listings and
       enquiries still work offline and sync when you reconnect.</p>
    <a href="/orgs">Go to your workspaces</a>
  </main>
</body>
</html>
