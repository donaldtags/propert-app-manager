databases:
  - name: primenest-db
    databaseName: primenest_prop
    plan: free
    postgresMajorVersion: "16"

services:
  - type: web
    name: primenest-backend
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    plan: free
    healthCheckPath: /api/v1/investments/reits
    envVars:
      - key: DB_DRIVER
        value: org.postgresql.Driver
      - key: DB_KIND
        value: postgresql
      - key: DB_URL_PARAMS
        value: "?sslmode=prefer"
      - key: DB_HOST
        fromDatabase:
          name: primenest-db
          property: host
      - key: DB_PORT
        fromDatabase:
          name: primenest-db
          property: port
      - key: DB_NAME
        fromDatabase:
          name: primenest-db
          property: database
      - key: DB_USERNAME
        fromDatabase:
          name: primenest-db
          property: user
      - key: DB_PASSWORD
        fromDatabase:
          name: primenest-db
          property: password
      - key: SERVER_PORT
        value: "8081"
      - key: CORS_ORIGINS
        value: "https://primenest-frontend.onrender.com,http://localhost:3000,http://localhost:3001,http://127.0.0.1:3000,http://127.0.0.1:3001"
      - key: API_PUBLIC_BASE_URL
        value: "https://primenest-backend-xwgh.onrender.com"
      - key: WEB_BASE_URL
        value: "https://primenest-frontend.onrender.com"
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: S3_ENDPOINT
        sync: false
      - key: S3_ACCESS_KEY_ID
        sync: false
      - key: S3_SECRET_ACCESS_KEY
        sync: false
      - key: S3_BUCKET_NAME
        sync: false
      - key: S3_REGION
        sync: false

  - type: web
    name: primenest-frontend
    runtime: docker
    rootDir: frontend
    dockerfilePath: ./Dockerfile
    dockerContext: .
    plan: free
    envVars:
      - key: NEXT_PUBLIC_API_BASE_URL
        value: "https://primenest-backend-xwgh.onrender.com/api/v1"
