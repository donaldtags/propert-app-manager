databases:
  - name: primenest-db
    databaseName: primenest_prop
    plan: free
    postgresMajorVersion: "16"

services:
  - type: web
    name: primenest-backend
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    plan: free
    healthCheckPath: /api/v1/investments/reits
    envVars:
      - key: DB_DRIVER
        value: org.postgresql.Driver
      - key: DB_URL
        sync: false
      - key: DB_USERNAME
        fromDatabase:
          name: primenest-db
          property: user
      - key: DB_PASSWORD
        fromDatabase:
          name: primenest-db
          property: password
      - key: SERVER_PORT
        value: "8081"
      - key: CORS_ALLOWED_ORIGINS
        sync: false
      - key: PUBLIC_BASE_URL
        sync: false
      - key: FRONTEND_BASE_URL
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
