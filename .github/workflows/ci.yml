name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A newer push to the same branch or PR cancels the run it replaces.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      # setup-java's cache only covers ~/.m2/repository; the wrapper keeps Maven itself in
      # ~/.m2/wrapper, so cache that too and stop fetching it from Maven Central every run.
      - name: Cache Maven distribution
        uses: actions/cache@v4
        with:
          path: ~/.m2/wrapper
          key: maven-wrapper-${{ hashFiles('.mvn/wrapper/maven-wrapper.properties') }}
      # On a cache miss, retry the download so one Maven Central blip doesn't fail the run.
      - name: Install Maven
        run: |
          for attempt in 1 2 3; do
            ./mvnw -B -ntp --version && exit 0
            echo "Maven download failed (attempt $attempt), retrying in 15s"
            sleep 15
          done
          exit 1
      # Self-contained: the "test" profile uses an in-memory H2 database.
      - name: Run tests
        run: ./mvnw -B -ntp test
      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: target/surefire-reports/
          retention-days: 14

  frontend:
    name: Frontend checks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Type check
        run: npm run typecheck
      - name: Unit tests
        run: npm test
      - name: Build
        run: npm run build
      # Warnings fail the build too, so the count stays at zero.
      - name: Lint
        run: npm run lint -- --max-warnings=0

  qa-suite:
    name: QA suite type check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: qa-automation
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: qa-automation/package-lock.json
      - run: npm ci
      # The Playwright specs run against a live stack, so CI only checks they compile.
      - run: npm run typecheck
